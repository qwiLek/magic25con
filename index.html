<title>Magic Rust — Подключение к серверам</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #171a21;
    --card-hover: #1e222b;
    --accent: #e05a2b;
    --accent-hover: #ff6b35;
    --text: #e6e6e6;
    --muted: #8b93a1;
    --border: #262b36;
    --chip: #222732;
    --chip-active: #e05a2b;
    --copy: #2a3140;
    --copy-hover: #343d4f;
    --ok: #3ba55d;
    --warn: #c9a227;
    --soon: #e05a2b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 24px 16px 64px;
  }
  .wrap { max-width: 780px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 22px; }
  header h1 { font-size: 1.8rem; font-weight: 700; letter-spacing: -0.5px; }
  header h1 span { color: var(--accent); }
  header p { color: var(--muted); margin-top: 6px; font-size: 0.95rem; }

  .filters {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 24px;
    position: sticky;
    top: 10px;
    z-index: 5;
    box-shadow: 0 6px 24px rgba(0,0,0,0.35);
  }
  .filter-row {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 10px;
  }
  .filter-row:last-child { margin-bottom: 0; }
  .filter-label {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
    width: 90px;
    flex-shrink: 0;
    padding-top: 5px;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; flex: 1; }
  .chip {
    background: var(--chip);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 5px 12px;
    font-size: 0.8rem;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s, color 0.15s;
    user-select: none;
  }
  .chip:hover { border-color: #3a4252; }
  .chip.active {
    background: var(--chip-active);
    border-color: var(--chip-active);
    color: #fff;
    font-weight: 600;
  }
  .chip.wipe { font-size: 0.74rem; padding: 4px 9px; }
  .reset {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 5px 12px;
    font-size: 0.8rem;
    cursor: pointer;
    transition: color 0.15s, border-color 0.15s;
    align-self: flex-start;
    white-space: nowrap;
  }
  .reset:hover { color: var(--text); border-color: #3a4252; }

  .day { margin-bottom: 22px; }
  .day-title {
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    color: var(--muted);
    margin-bottom: 10px;
    border-left: 3px solid var(--accent);
    padding-left: 10px;
  }
  .servers { display: grid; gap: 8px; }

  .server {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 16px;
    transition: background 0.15s, border-color 0.15s;
  }
  .server:hover { background: var(--card-hover); border-color: #333a48; }

  .info { min-width: 0; flex: 1; }
  .name { font-weight: 600; font-size: 1rem; }
  .name .tag {
    font-size: 0.72rem;
    font-weight: 500;
    color: var(--muted);
    background: #222732;
    padding: 2px 7px;
    border-radius: 5px;
    margin-left: 6px;
    vertical-align: middle;

  .meta {
    color: var(--muted);
    font-size: 0.8rem;
    margin-top: 3px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    word-break: break-all;

  .note { color: var(--warn); font-size: 0.78rem; margin-top: 4px; }

  .wipe-block {
    margin-top: 6px;
    font-size: 0.8rem;

    flex-wrap: wrap;
    align-items: center;

    font-weight: 600;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    color: var(--text);
    background: #222732;
    padding: 2px 8px;
    border-radius: 6px;
    border: 1px solid var(--border);

  .wipe-timer.today { color: #fff; background: var(--ok); border-color: var(--ok); }
  .wipe-kind { font-size: 0.74rem; color: var(--muted); }
  .wipe-kind b { color: var(--text); font-weight: 600; }

  .actions {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }

  .copy-btn {
    width: 40px;
    height: 40px;
    padding: 0;
    background: var(--copy);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background 0.15s, border-color 0.15s, color 0.15s, transform 0.05s;
  }
  .copy-btn:hover { background: var(--copy-hover); border-color: #3a4252; }
  .copy-btn:active { transform: scale(0.95); }
  .copy-btn.copied {
    background: var(--ok);
    border-color: var(--ok);
    color: #fff;
  }
  .copy-btn svg { width: 18px; height: 18px; display: block; }

  .btn {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 9px 18px;
    font-size: 0.88rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s, transform 0.05s;
    white-space: nowrap;
    height: 40px;
  }
  .btn:hover { background: var(--accent-hover); }
  .btn:active { transform: scale(0.97); }

  .empty {
    text-align: center;
    color: var(--muted);
    padding: 40px 16px;
    font-size: 0.95rem;
  }

  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(120%);

    color: var(--text);
    padding: 12px 20px;
    border-radius: 10px;
    border: 1px solid var(--border);

    text-align: center;
    z-index: 10;

  .toast b { color: var(--accent); }
  .toast code {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    background: #171a21;
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 0.82rem;

    .server { flex-direction: column; align-items: stretch; }
    .actions { justify-content: space-between; }
    .copy-btn { width: 44px; height: 44px; }
    .btn { flex: 1; height: 44px; }
    .filter-label { width: 100%; padding-top: 0; margin-bottom: 2px; }
    .filters { position: static; }

const COPY_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
const CHECK_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';

function serverNumber(id) {
  const m = id.match(/(\d+)/);
  return m ? parseInt(m[1], 10) : Infinity;
}

function sortServers(list) {
  return list.slice().sort((a, b) => {
    const na = serverNumber(a.id);
    const nb = serverNumber(b.id);
    if (na !== nb) return na - nb;
    return a.id.localeCompare(b.id);
  });
}

function showToast(html) {
  try {
    toastEl.innerHTML = html;
    toastEl.classList.add("show");
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => toastEl.classList.remove("show"), 4500);
  } catch(e) {}
}

function connect(server) {
  try {
    const address = server.ip + ":" + server.port;
    const steamUrl = "steam://run/252490//+connect%20" + encodeURIComponent(address);
    window.location.href = steamUrl;
    showToast("Запускаю Rust и подключаюсь к <b>" + server.id + "</b><br>Если Steam не открылся — разреши браузеру запустить приложение.");
  } catch(e) {}
}

function copyCommand(server, btn) {
  try {
    const cmd = "client.connect " + server.ip + ":" + server.port;
    const ta = document.createElement("textarea");
    ta.value = cmd;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    document.body.removeChild(ta);

    btn.classList.add("copied");
    btn.innerHTML = CHECK_ICON;
    clearTimeout(btn._t);
    btn._t = setTimeout(() => {
      btn.classList.remove("copied");
      btn.innerHTML = COPY_ICON;
    }, 2000);
    showToast("Команда скопирована:<br><code>" + cmd + "</code>");
  } catch(e) {
    showToast("Не удалось скопировать.");
  }
}

function buildChips(container, labels, stateKey, extraClass) {
  container.innerHTML = "";
  Object.entries(labels).forEach(([key, label]) => {
    const chip = document.createElement("button");
    chip.className = "chip" + (extraClass ? " " + extraClass : "");
    chip.textContent = label;
    chip.dataset.key = key;
    chip.addEventListener("click", () => {
      if (state[stateKey].has(key)) state[stateKey].delete(key);
      else state[stateKey].add(key);
      chip.classList.toggle("active");
      render();
    });
    container.appendChild(chip);
  });
}

function resetFilters() {
  state.team.clear();
  state.type.clear();
  state.wipe.clear();
  document.querySelectorAll(".chip.active").forEach(c => c.classList.remove("active"));
  render();
}

function matches(server) {
  const teamOk = state.team.size === 0 || state.team.has(server.team);
  const typeOk = state.type.size === 0 || state.type.has(server.type);
  const wipeOk = state.wipe.size === 0 || state.wipe.has(server.day);
  return teamOk && typeOk && wipeOk;
}

function getNextWipe(dayKey, serverWipeKey) {
  let cfg, actualKey = dayKey;
  if (serverWipeKey === "fri_far_east") { cfg = WIPE_SCHEDULE_FAR_EAST.fri; actualKey = "fri"; }
  else { cfg = WIPE_SCHEDULE[dayKey]; }
  if (!cfg) return null;
  
  let next = new Date(cfg.next);
  const now = new Date();

  if (actualKey === "month") {
    while (next <= now) {
      const y = next.getFullYear();
      const m = next.getMonth() + 1;
      const targetMonth = m > 11 ? 0 : m;
      const targetYear = m > 11 ? y + 1 : y;
      next = firstThursday(targetYear, targetMonth, 14, 0);
    }
  } else {
    while (next <= now) {
      next = new Date(next.getTime() + 7 * 24 * 60 * 60 * 1000);
    }
  }
  return { date: next, kind: cfg.kind };
}

function firstThursday(year, month, hour, minute) {
  const d = new Date(year, month, 1, hour, minute, 0, 0);
  d.setDate(1 + ((4 - d.getDay() + 7) % 7));
  return d;
}

function formatCountdown(ms) {
  if (ms <= 0) return { text: "идёт", cls: "today" };
  const totalMin = Math.floor(ms / 60000);
  const days = Math.floor(totalMin / (60 * 24));
  const hours = Math.floor((totalMin % (60 * 24)) / 60);
  const mins = totalMin % 60;

  const parts = [];
  if (days > 0) parts.push(days + " д");
  if (days > 0 || hours > 0) parts.push(hours + " ч");
  parts.push(mins + " мин");

  let cls = "";
  if (days === 0) cls = "soon";

  return { text: parts.join(" "), cls };
}

function formatDate(d) {
  const dd = String(d.getDate()).padStart(2, "0");
  const mm = String(d.getMonth() + 1).padStart(2, "0");
  const yyyy = d.getFullYear();
  const hh = String(d.getHours()).padStart(2, "0");
  const mi = String(d.getMinutes()).padStart(2, "0");
  return `${dd}.${mm}.${yyyy} ${hh}:${mi} МСК`;
}

function renderServer(s) {
  const row = document.createElement("div");
  row.className = "server";

  const info = document.createElement("div");
  info.className = "info";

  const name = document.createElement("div");
  name.className = "name";
  name.innerHTML = s.id + ' <span class="tag">' + s.mode + '</span>';
  info.appendChild(name);

  const meta = document.createElement("div");
  meta.className = "meta";
  meta.textContent = s.ip + ":" + s.port;
  info.appendChild(meta);

  try {
    const wipe = getNextWipe(s.day, s.wipeKey);
    if (wipe) {
      const cd = formatCountdown(wipe.date - new Date());
      const block = document.createElement("div");
      block.className = "wipe-block";
      block.innerHTML = `<span class="wipe-label">Вайп через:</span>
        <span class="wipe-timer ${cd.cls}" data-wipe-ts="${wipe.date.getTime()}">${cd.text}</span>
        <span class="wipe-kind"><b>${wipe.kind}</b> · ${formatDate(wipe.date)}</span>`;
      info.appendChild(block);
    }
  } catch (e) {
    console.warn("Ошибка таймера для", s.id, e);
  }

  if (s.note) {
    const note = document.createElement("div");
    note.className = "note";
    note.textContent = "⚠ " + s.note;
    info.appendChild(note);
  }

  const actions = document.createElement("div");
  actions.className = "actions";

  const copyBtn = document.createElement("button");
  copyBtn.className = "copy-btn";
  copyBtn.innerHTML = COPY_ICON;
  copyBtn.title = "Скопировать команду для консоли Rust";
  copyBtn.addEventListener("click", () => copyCommand(s, copyBtn));

  const btn = document.createElement("button");
  btn.className = "btn";
  btn.textContent = "Подключиться";
  btn.addEventListener("click", () => connect(s));

  actions.appendChild(copyBtn);
  actions.appendChild(btn);
  row.appendChild(info);
  row.appendChild(actions);
  return row;
}

function render() {
  try {
    menuEl.innerHTML = "";
    const hasWipeFilter = state.wipe.size > 0;

    const filtered = sortServers(ALL_SERVERS.filter(matches));

    if (filtered.length === 0) {
      menuEl.innerHTML = '<div class="empty">Нет серверов под выбранные фильтры. Попробуй сбросить.</div>';
      return;
    }

    if (hasWipeFilter) {
      const groups = {};
      filtered.forEach(s => {
        if (!groups[s.day]) groups[s.day] = [];
        groups[s.day].push(s);
      });

      // Обновленный порядок дней для группировки (1-й Чт в конце)
      const dayOrder = ["mon", "tue", "wed", "thu", "fri", "sat", "sun", "month"];
      
      dayOrder.forEach(dayKey => {
        if (!groups[dayKey] || groups[dayKey].length === 0) return;
        
        const dayEl = document.createElement("section");
        dayEl.className = "day";

        const title = document.createElement("div");
        title.className = "day-title";
        const dayTitle = WIPE_SCHEDULE[dayKey] ? WIPE_SCHEDULE[dayKey].title : dayKey;
        title.textContent = dayTitle + "  ·  " + groups[dayKey].length;
        dayEl.appendChild(title);

        const list = document.createElement("div");
        list.className = "servers";
        groups[dayKey].forEach(s => list.appendChild(renderServer(s)));
        dayEl.appendChild(list);
        menuEl.appendChild(dayEl);
      });
      return;
    }

    const list = document.createElement("div");
    list.className = "servers";
    filtered.forEach(s => list.appendChild(renderServer(s)));
    menuEl.appendChild(list);

  } catch(e) {
    console.error("Критическая ошибка рендера:", e);
    menuEl.innerHTML = '<div class="empty" style="color:#e05a2b">Произошла ошибка при отображении списка. Обновите страницу (Ctrl+F5).</div>';
  }
}

function tickTimers() {
  try {
    document.querySelectorAll(".wipe-timer").forEach(el => {
      const ts = Number(el.dataset.wipeTs);
      if (!ts) return;
      const cd = formatCountdown(ts - Date.now());
      el.textContent = cd.text;
      el.className = "wipe-timer " + cd.cls;
    });
  } catch(e) {}
}
setInterval(tickTimers, 30000);

try {
  buildChips(teamChipsEl, TEAM_LABELS, "team");
  buildChips(typeChipsEl, TYPE_LABELS, "type");
  buildChips(wipeChipsEl, WIPE_LABELS, "wipe", "wipe");
  document.getElementById("resetBtn").addEventListener("click", resetFilters);
  render();
} catch(e) {
  console.error("Ошибка инициализации:", e);
}
</script>
